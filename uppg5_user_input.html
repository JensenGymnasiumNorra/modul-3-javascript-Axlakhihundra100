<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uppgift 1: Alert</title>
  </head>
  <body>
    <button onclick="showAlert()">Click me for to be welcomed</button>
  </body>

  <script>

    function showAlert(){
      let food = prompt('What is your favorite food?')
      let truefalse = confirm('confirm or deny')
      if (truefalse) {
        alert (`Welcome to the site! Your favorite food is ${food} MUMS`)
      }
      else {
        window.close()
    };
}
