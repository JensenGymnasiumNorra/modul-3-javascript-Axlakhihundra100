    Använd från genomgången (som ligger i filen nedan) för att skapa en miniräknare som fungerar för + - / *
    Extrauppgift 1: Ändra inputfälten till sliders
    Extrauppgift 2: Lägg till en dropdown för räknesätt och en knapp som utför beräkningen
    Extrauppgift 3: Lägg till en knapp som lägger till en till slider/inputfält som ska ingå i beräkningen
    För extrauppgift 3 krävs getElementsByClass

<!-- OBS OBS OBS, hovera över operation för operation, inte riktigt självklart-->>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator Example</title>
  </head>
  <body>
    <div class="range1">
    <input type="range" id="num1" min="0" max="100" onchange = "range1value.value = num1.value"/>
    <p>Number 1: <span id="value1"></span></p>
    </div> 

    <div class="range2">
    <input type="range" id="num2" min="0" max="100"/>
    <p>Number 2: <span id="value2"></span></p>
    </div>
    
    
    <div class="dropdown">Operation
      <div class="dropdown-content">
        <button onclick="calculateSum()">+</button>
        <button onclick="calculateDifference()">-</button>
        <button onclick="calculateProduct()">*</button>
        <button onclick="calculateQuotient()">/</button>
      </div>
    </div>

    <div class="mrg"><p>1</p></div>

    <p id="result">Result:</p>
  </body>
  <script src="simple_calculator.js"></script>
</html>
<style>

.mrg {
  margin-top: 20px;
}
.dropdown {
  position: relative;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #f9f9f9;
  min-width: 130px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  padding: 12px 16px;
}

.dropdown:hover .dropdown-content {
  display: block;
}
</style>
